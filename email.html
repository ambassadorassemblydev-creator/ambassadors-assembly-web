<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: 'Inter', -apple-system, system-ui, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 0; }
    .wrapper { width: 100%; padding: 40px 0; background-color: #f8fafc; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    .header { background: #176a60; padding: 40px; text-align: center; }
    .logo { width: 100px; height: 100px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.2); }
    .content { padding: 48px 40px; text-align: center; }
    .title { font-size: 24px; font-weight: 800; margin-bottom: 16px; color: #176a60; letter-spacing: -0.025em; }
    .text { color: #475569; font-size: 16px; line-height: 1.7; margin-bottom: 32px; white-space: pre-wrap; }
    .button { display: inline-block; padding: 14px 32px; background: #176a60; color: #ffffff !important; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.2s; }
    .footer { padding: 32px; text-align: center; font-size: 12px; color: #94a3b8; background: #f8fafc; border-top: 1px solid #e2e8f0; }
    .footer p { margin: 4px 0; }
    .social-links { margin-top: 16px; }
    .social-links a { color: #176a60; text-decoration: none; margin: 0 8px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <img src="https://res.cloudinary.com/dxwhpacz7/image/upload/v1775200226/IMG-20260304-WA0059_telyum.jpg" class="logo" alt="Ambassadors Assembly">
      </div>
      <div class="content">
        <h1 class="title">${title}</h1>
        <div class="text">${content}</div>
        ${buttonHtml}
      </div>
      <div class="footer">
        <p><strong>The Ambassadors' Assembly</strong></p>
        <p>7 Fashe Street, Omole Phase 2, Lagos, Nigeria</p>
        <p>&copy; ${new Date().getFullYear()} Ambassadors Assembly. All rights reserved.</p>
        <div class="social-links">
          <a href="https://instagram.com/theambassadorsassembly">Instagram</a>
          <a href="https://youtube.com/@theambassadorsassembly">YouTube</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
